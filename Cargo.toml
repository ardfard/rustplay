[package]
name = "rustplay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "list-pg-db"
path = "src/bin/list-pg-db.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"

[dependencies]
postgres = "0.19.10"
hyper = { version = "1.7.0", features = ["full"] }
tokio = { version = "1.47.1", features = ["full"] }
http-body-util = "0.1.3"
axum ="0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header", "multipart"] }
headers = "0.4.1"
async-trait = "0.1"
hyper-util =  { version = "0.1.16", features = ["full"] }
clap = { version = "4.5.47", features = ["derive"]}
serde = { version = "1.0.221", features = ["derive"]}
serde_json = "1.0"
tower-http = { version = "0.6.6", features = ["full"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
temporal-sdk-core = "0.1.0-alpha.1"

[profile.release]
debug = true
